[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Tallyable look (prototype 1): cream paper, forest green, sunny yellow, chunky rounded headings.
# Locked to light (Kevin, 2026-11-05): the app always opens light, whatever the system setting.
[theme]
base = "light"
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fredoka:https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "1rem"
buttonRadius = "1rem"
showWidgetBorder = true
primaryColor = "#1C5C36"
backgroundColor = "#FFFCF1"
secondaryBackgroundColor = "#FFFFFF"  # inputs: white reads as "type here" on the cream page
textColor = "#1F2A22"
borderColor = "#E3D9B6"
linkColor = "#1C5C36"
dataframeHeaderBackgroundColor = "#F2ECD3"

[theme.sidebar]
backgroundColor = "#FAF7E7"
